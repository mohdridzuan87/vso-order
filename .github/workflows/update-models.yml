name: Refresh model list

on:
  schedule:
    - cron: "0 2 1,15 * *"   # 1st and 15th of every month, 02:00 UTC (10:00 Malaysia)
  workflow_dispatch:          # can also be run by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install pymupdf

      - name: Read Toyota Malaysia price lists and colours
        run: python scripts/update_models.py

      - name: Save changes
        id: save
        run: |
          if [ -n "$(git status --porcelain data/models.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/models.json
            git commit -m "Refresh model list"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change in Toyota's data"
          fi

      - name: Publish the new list
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
